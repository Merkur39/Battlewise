<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Choisir une attaque — piste B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap">
<style>
body{margin:0}
:root{color-scheme:dark}
*{scrollbar-width:thin;scrollbar-color:#2C383D transparent}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#2C383D;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#7D8B91}
button,input{font:inherit;color:inherit;margin:0}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:#8EBDE3}a:hover{color:#B5D4F0}
input::placeholder{color:#7D8B91}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="k-title" style="width: 390px; height: 844px; box-sizing: border-box; background: #0D1214; color: #E2E8E8; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 4px; padding: 6px 16px 6px 4px; border-bottom: 1px solid #2C383D">
    <a href="SimB-Simulation.dc.html" aria-label="Fermer" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #97A5AA">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <h2 id="k-title" style="margin: 0; flex: 1; font-size: 18px; font-weight: 500">Choisir une attaque</h2>
  </header>

  <div style="padding: 12px 16px 0">
    <a href="SimB-Recherche.dc.html" style="display: flex; align-items: center; gap: 8px; height: 44px; border: 1px solid #2C383D; border-radius: 4px; padding: 0 12px; color: #7D8B91; text-decoration: none; font-size: 15px">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#7D8B91" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      Ennemi ou attaque, tous biomes
    </a>
  </div>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 18px">
    <section aria-labelledby="k-recent" style="flex: none; display: flex; flex-direction: column">
      <h3 id="k-recent" style="margin: 0 0 4px; font-size: 11px; font-weight: 400; letter-spacing: 0.08em; color: #97A5AA">RÉCENTES</h3>
      <sc-for list="{{ recent }}" as="a" hint-placeholder-count="2">
        <a href="SimB-Simulation.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 52px; border-bottom: 1px solid #1F2A2E; color: #E2E8E8; text-decoration: none">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#7D8B91" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 14px">{{ a.name }}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #97A5AA">{{ a.tags }}</span>
          </span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px">{{ a.dmg }}</span>
        </a>
      </sc-for>
    </section>

    <section aria-labelledby="k-enn" style="flex: none; display: flex; flex-direction: column; gap: 8px">
      <h3 id="k-enn" style="margin: 0; font-size: 11px; font-weight: 400; letter-spacing: 0.08em; color: #97A5AA">ENNEMIS</h3>
      <div role="group" aria-label="Biome" style="display: flex; align-items: center; background: #151C1F; border-radius: 6px">
        <button type="button" aria-label="Biome précédent : Prairies" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #97A5AA"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px">
          <span style="font-size: 15px; font-weight: 500">Forêt noire</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #97A5AA">BIOME 2 SUR 8</span>
        </div>
        <button type="button" aria-label="Biome suivant : Marais" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #97A5AA"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
      </div>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
        <sc-for list="{{ enemies }}" as="e" hint-placeholder-count="7">
          <li style="border-bottom: 1px solid #1F2A2E">
            <sc-if value="{{ e.known }}" hint-placeholder-val="{{ true }}">
              <a href="SimB-Monstre.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 52px; color: #E2E8E8; text-decoration: none">
                <span style="flex: 1; font-size: 15px">{{ e.name }}</span>
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #97A5AA">{{ e.count }}</span>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#7D8B91" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
              </a>
            </sc-if>
            <sc-if value="{{ e.unknown }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; align-items: center; gap: 10px; min-height: 52px; color: #7D8B91">
                <span style="flex: 1; font-size: 15px">{{ e.name }}</span>
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">À EXTRAIRE</span>
              </div>
            </sc-if>
          </li>
        </sc-for>
      </ul>
      <span style="font-size: 12px; color: #7D8B91">Touche un ennemi pour voir ses attaques, puis l'attaque à simuler.</span>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const enemies = [
      ['Naingris', 2], ['Chaman naingris', 1], ['Brute naingris', 1], ['Squelette', 0],
      ['Troll', 3], ['Fantôme', 0], ["L'Aîné", 0]
    ];
    return {
      recent: [
        { name: 'Troll · coup de tronc', tags: 'FORÊT NOIRE · MÊLÉE', dmg: '130' },
        { name: 'Brute naingris · coup de poing', tags: 'FORÊT NOIRE · MÊLÉE', dmg: '70' }
      ],
      enemies: enemies.map(([name, n]) => ({
        name: name, known: n > 0, unknown: n === 0,
        count: n + (n > 1 ? ' ATTAQUES' : ' ATTAQUE')
      }))
    };
  }
}
</script>
</body>
</html>
