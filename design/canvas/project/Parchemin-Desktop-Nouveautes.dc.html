<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouveautés — fenêtre desktop · Parchemin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap">
<style>
body{margin:0}
:root{color-scheme:light}
a{color:#24467A}a:hover{color:#1A3560}
</style>
</helmet>
<div style="position: relative; height: 100vh; min-height: 680px; box-sizing: border-box; display: flex; flex-wrap: wrap; font-family: 'IBM Plex Sans', system-ui, sans-serif; background: #EFE7D6; color: #2B2219">
  <div aria-hidden="true" style="flex: 0 0 248px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: 20px 14px; border-right: 1px solid #CDBFA3">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px; height: 40px; font-size: 16px; font-weight: 500">Foelore</div>
    <div style="display: flex; flex-direction: column; gap: 2px; font-size: 15px">
      <span style="height: 44px; display: flex; align-items: center; padding: 0 12px; border-radius: 6px; background: #E3D3B0; color: #24467A">Bestiaire</span>
      <span style="height: 44px; display: flex; align-items: center; padding: 0 12px; color: #5E5141">Simulation</span>
      <span style="height: 44px; display: flex; align-items: center; padding: 0 12px; color: #5E5141">Arsenal</span>
      <span style="height: 44px; display: flex; align-items: center; padding: 0 12px; color: #5E5141">Mémo</span>
    </div>
  </div>
  <div aria-hidden="true" style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 24px">
    <span style="font-size: 26px; font-weight: 500">Bestiaire</span>
    <div style="display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 24px">
      <div style="height: 560px; border-radius: 8px; background: #F9F4E8"></div>
      <div style="height: 420px; border-radius: 8px; background: #F9F4E8"></div>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(4, 6, 7, 0.72); display: flex; align-items: center; justify-content: center; padding: 32px; box-sizing: border-box">
    <div role="dialog" aria-modal="true" aria-labelledby="p-title" style="width: min(680px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; background: #F9F4E8; border: 1px solid #CDBFA3">
      <header style="display: flex; align-items: center; gap: 4px; padding: 12px; border-bottom: 1px solid #CDBFA3">
        <a href="Parchemin-Desktop-Reglages.dc.html" aria-label="Retour aux réglages" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #5E5141"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
        <h2 id="p-title" style="margin: 0; flex: 1; font-size: 18px; font-weight: 500">Nouveautés</h2>
        <a href="Parchemin-Desktop-Bestiaire.dc.html" aria-label="Fermer" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #5E5141"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
      </header>
      <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px">
        <sc-for list="{{ versions }}" as="v" hint-placeholder-count="3">
          <section style="display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding-bottom: 16px; border-bottom: 1px solid #E2D7C1">
            <h3 style="margin: 0; display: flex; flex-direction: column; gap: 2px; font-weight: 400"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500">{{ v.version }}</span><span style="font-size: 12px; color: #685B4A">{{ v.date }}</span></h3>
            <span style="display: flex; flex-direction: column; gap: 14px">
              <sc-for list="{{ v.items }}" as="i" hint-placeholder-count="2">
                <div style="display: grid; grid-template-columns: 76px minmax(0, 1fr); column-gap: 12px; align-items: baseline"><span style="justify-self: start; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.06em; line-height: 18px; padding: 0 5px; border: 1px solid #CDBFA3; border-radius: 3px; color: #5E5141">{{ i.kind }}</span><span style="min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500; line-height: 1.35">{{ i.title }}</span><sc-if value="{{ i.hasDetail }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; line-height: 1.4; color: #5E5141">{{ i.detail }}</span></sc-if><sc-if value="{{ i.hasThanks }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #5E5141">Merci {{ i.thanks }}<sc-if value="{{ i.isYours }}" hint-placeholder-val="{{ false }}"> · ton signalement {{ i.number }}</sc-if></span></sc-if></span></div>
              </sc-for>
            </span>
          </section>
        </sc-for>
      </div>
      <footer style="display: flex; justify-content: flex-end; padding: 16px 24px; border-top: 1px solid #CDBFA3">
        <a href="Parchemin-Desktop-Bestiaire.dc.html" style="display: inline-flex; align-items: center; height: 40px; padding: 0 20px; border-radius: 4px; font-size: 14px; text-decoration: none; border: 1px solid #CDBFA3; color: #2B2219">Fermer</a>
      </footer>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const item = (kind, title, detail, thanks, number) => ({ kind: kind, title: title, hasDetail: Boolean(detail), detail: detail || '', hasThanks: Boolean(thanks), thanks: thanks || '', isYours: Boolean(number), number: number || '' });
    return {
      versions: [
        { version: '1.14.3', date: '2 nov. 2026', items: [
          item('CORRIGÉ', 'Troll › Frappe au sol : 70 dégâts, pas 60', '', 'Ragnar', '#48')
        ] },
        { version: '1.14.2', date: '31 oct. 2026', items: [
          item('AMÉLIORÉ', 'Maintiens + ou − pour aller plus vite', 'PV max, compétence Blocage, niveaux, Valeur libre.'),
          item('CORRIGÉ', 'Cliquer vite ne sélectionne plus le texte voisin')
        ] },
        { version: '1.14.1', date: '31 oct. 2026', items: [
          item('NOUVEAU', 'Ton monde montre la taille et la vitesse des monstres', "Jusqu'à ×1,2 en Très difficile, hors donjons. Leurs attaques ne vont pas plus vite.")
        ] },
        { version: '1.14.0', date: '31 oct. 2026', items: [
          item('NOUVEAU', 'Emporte ton bibelot, ton pouvoir et tes boissons', 'Allume-les sur une fiche ou dans la Simulation : les verdicts suivent.'),
          item('NOUVEAU', "L'Arsenal liste aussi armures, capes et effets", "Une recherche fouille tout ; une ligne t'en équipe."),
          item('AMÉLIORÉ', "Ton équipement se choisit dans les listes de l'Arsenal", 'Un nouveau joueur commence à mains nues.')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
