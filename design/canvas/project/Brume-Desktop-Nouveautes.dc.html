<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouveautés — fenêtre desktop · Brume</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap">
<style>
body{margin:0}
:root{color-scheme:dark}
a{color:#BBA6F7}a:hover{color:#D5C8FB}
</style>
</helmet>
<div style="position: relative; height: 100vh; min-height: 680px; box-sizing: border-box; display: flex; flex-wrap: wrap; font-family: 'IBM Plex Sans', system-ui, sans-serif; background: #110F18; color: #E9E5F3">
  <div aria-hidden="true" style="flex: 0 0 248px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: 20px 14px; border-right: 1px solid #342D47">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px; height: 40px; font-size: 16px; font-weight: 500">Foelore</div>
    <div style="display: flex; flex-direction: column; gap: 2px; font-size: 15px">
      <span style="height: 44px; display: flex; align-items: center; padding: 0 12px; border-radius: 6px; background: #2E2747; color: #BBA6F7">Bestiaire</span>
      <span style="height: 44px; display: flex; align-items: center; padding: 0 12px; color: #A9A2BF">Simulation</span>
      <span style="height: 44px; display: flex; align-items: center; padding: 0 12px; color: #A9A2BF">Arsenal</span>
      <span style="height: 44px; display: flex; align-items: center; padding: 0 12px; color: #A9A2BF">Mémo</span>
    </div>
  </div>
  <div aria-hidden="true" style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 24px">
    <span style="font-size: 26px; font-weight: 500">Bestiaire</span>
    <div style="display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 24px">
      <div style="height: 560px; border-radius: 8px; background: #1A1724"></div>
      <div style="height: 420px; border-radius: 8px; background: #1A1724"></div>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(4, 6, 7, 0.72); display: flex; align-items: center; justify-content: center; padding: 32px; box-sizing: border-box">
    <div role="dialog" aria-modal="true" aria-labelledby="p-title" style="width: min(680px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; background: #1A1724; border: 1px solid #342D47">
      <header style="display: flex; align-items: center; gap: 4px; padding: 12px; border-bottom: 1px solid #342D47">
        <a href="Brume-Desktop-Reglages.dc.html" aria-label="Retour aux réglages" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #A9A2BF"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
        <h2 id="p-title" style="margin: 0; flex: 1; font-size: 18px; font-weight: 500">Nouveautés</h2>
        <a href="Brume-Desktop-Bestiaire.dc.html" aria-label="Fermer" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #A9A2BF"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
      </header>
      <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px">
        <sc-for list="{{ versions }}" as="v" hint-placeholder-count="3">
          <section style="display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding-bottom: 14px; border-bottom: 1px solid #241F33">
            <h3 style="margin: 0; display: flex; flex-direction: column; gap: 2px; font-weight: 400"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500">{{ v.version }}</span><span style="font-size: 12px; color: #8D86A4">{{ v.date }}</span></h3>
            <span style="display: flex; flex-direction: column; gap: 8px">
              <sc-for list="{{ v.items }}" as="i" hint-placeholder-count="2">
                <p style="margin: 0; display: flex; flex-direction: column; gap: 2px; font-size: 14px; line-height: 1.45"><span>{{ i.text }}</span><sc-if value="{{ i.hasThanks }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #A9A2BF">Merci {{ i.thanks }}<sc-if value="{{ i.isYours }}" hint-placeholder-val="{{ false }}"> · ton signalement {{ i.number }}</sc-if></span></sc-if></p>
              </sc-for>
            </span>
          </section>
        </sc-for>
      </div>
      <footer style="display: flex; justify-content: flex-end; padding: 16px 24px; border-top: 1px solid #342D47">
        <a href="Brume-Desktop-Bestiaire.dc.html" style="display: inline-flex; align-items: center; height: 40px; padding: 0 20px; border-radius: 4px; font-size: 14px; text-decoration: none; border: 1px solid #342D47; color: #E9E5F3">Fermer</a>
      </footer>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const item = (text, thanks, number) => ({ text: text, hasThanks: Boolean(thanks), thanks: thanks || '', isYours: Boolean(number), number: number || '' });
    return {
      versions: [
        { version: '1.5.0', date: '2 nov. 2026', items: [
          item('Troll › Frappe au sol : 60 dégâts, plus 70.', 'Ragnar', '#48'),
          item('Mes signalements et Nouveautés, dans Réglages.')
        ] },
        { version: '1.4.1', date: '27 oct. 2026', items: [
          item("Les invocations que le jeu ne lance jamais n'apparaissent plus.")
        ] },
        { version: '1.4.0', date: '27 oct. 2026', items: [
          item("Signaler un chiffre, un bug ou une idée depuis l'app.")
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
