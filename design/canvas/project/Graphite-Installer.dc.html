<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Installer l'app — Chrome, Edge, Samsung Internet · Graphite</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap">
<style>
body{margin:0}
:root{color-scheme:dark}
*{scrollbar-width:thin;scrollbar-color:#2E2E33 transparent}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#2E2E33;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#8A8A93}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
@keyframes sheet-in{from{transform:translateY(100%)}}
@keyframes pop-in{from{opacity:0;transform:translateY(-6px)}}
a{color:#6EA0FF}a:hover{color:#9CBEFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111113; color: #EDEDEF; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <header style="flex: none; display: flex; align-items: center; height: 52px; padding: 0 16px"><span style="display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 500"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#6EA0FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"></path></svg>Foelore</span></header>
  <main style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 24px 16px 0">
    <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 500">Installe Foelore</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #A1A1AA">Pour l'avoir sous la main, à côté du jeu.</p>
      </div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 12px; min-height: 34px; font-size: 15px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#6EA0FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg>Une icône sur ton écran d'accueil</span><span style="display: flex; align-items: center; gap: 12px; min-height: 34px; font-size: 15px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#6EA0FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>En plein écran, sans barre d'adresse</span><span style="display: flex; align-items: center; gap: 12px; min-height: 34px; font-size: 15px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#6EA0FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 4.2-2.3M14.8 10.2a10 10 0 0 1 4.2 2.3M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"></path><path d="M2 8.8a15 15 0 0 1 4.6-2.9M10.5 4.6A15 15 0 0 1 22 8.8M3 3l18 18"></path></svg>Marche sans connexion</span></div>
  </main>
  <footer style="flex: none; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 24px; border-top: 1px solid #2E2E33">
    <button type="button" onClick="{{ openPrompt }}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 4px; font-weight: 500; background: #6EA0FF; color: #111113"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Installer</button>
    <a href="Graphite-Bestiaire.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; margin: -4px 0 -6px; font-size: 15px; text-decoration: none">Continuer dans le navigateur</a>
    <span style="font-size: 12px; line-height: 1.45; color: #8A8A93; text-align: center">Tu la retrouves dans Réglages › À propos.</span>
  </footer>
  <sc-if value="{{ prompt }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closePrompt }}" style="position: absolute; inset: 0; background: rgba(4, 6, 7, 0.72)"></div>
    <div role="dialog" aria-modal="true" aria-label="Installer l'application" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 18px; padding: 20px 20px 24px; border-top: 1px solid #2E2E33; border-radius: 14px 14px 0 0; background: #1A1A1D; animation: sheet-in 0.25s cubic-bezier(0.2, 0, 0, 1)"><span style="font-size: 11px; letter-spacing: 0.08em; color: #8A8A93">FENÊTRE DU NAVIGATEUR</span>
      <span style="display: flex; align-items: center; gap: 14px">
        <span style="width: 48px; height: 48px; box-sizing: border-box; border: 1px solid #2E2E33; border-radius: 12px; background: #111113; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#6EA0FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">Foelore</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A1A1AA">foelore.vercel.app</span></span>
      </span>
      <span style="display: flex; justify-content: flex-end; gap: 8px">
        <button type="button" onClick="{{ closePrompt }}" style="height: 40px; padding: 0 16px; font-size: 14px; color: #A1A1AA">Annuler</button>
        <a href="Graphite-Bestiaire.dc.html" style="height: 40px; padding: 0 20px; display: flex; align-items: center; border-radius: 20px; background: #222226; font-size: 14px; color: #EDEDEF; text-decoration: none">Installer</a>
      </span></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { prompt: false };
  }
  renderVals() {
    return {
      prompt: this.state.prompt,
      openPrompt: () => this.setState({ prompt: true }),
      closePrompt: () => this.setState({ prompt: false })
    };
  }
}
</script>
</body>
</html>
