<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mémo — desktop · Graphite</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap">
<style>
body{margin:0}
:root{color-scheme:dark}
*{scrollbar-width:thin;scrollbar-color:#2E2E33 transparent}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#2E2E33;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#8A8A93}
button,input{font:inherit;color:inherit;margin:0}
a{color:#6EA0FF}a:hover{color:#9CBEFF}
input::placeholder{color:#8A8A93}
</style>
</helmet>
<div style="height: 100vh; min-height: 680px; box-sizing: border-box; display: flex; flex-wrap: wrap; background: #111113; color: #EDEDEF; font-family: 'IBM Plex Sans', system-ui, sans-serif">
  <nav aria-label="Navigation principale" style="flex: 0 0 248px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: 20px 14px; border-right: 1px solid #2E2E33">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px; height: 40px">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#6EA0FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"></path></svg>
      <span style="font-size: 16px; font-weight: 500">Foelore</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <a href="Graphite-Desktop-Bestiaire.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 6px; font-size: 15px; text-decoration: none; color: #A1A1AA"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.5" cy="10" r="2"></circle><circle cx="12" cy="6.5" r="2"></circle><circle cx="17.5" cy="10" r="2"></circle><path d="M8 18c0-3 1.8-5 4-5s4 2 4 5c0 1.7-1.8 2.5-4 2.5S8 19.7 8 18z"></path></svg>Bestiaire</a>
      <a href="Graphite-Desktop-Combat.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 6px; font-size: 15px; text-decoration: none; color: #A1A1AA"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>Simulation</a>
      <a href="Graphite-Desktop-Arsenal.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 6px; font-size: 15px; text-decoration: none; color: #A1A1AA"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4H20v5.5L9 20.5 3.5 15 14.5 4z"></path><path d="M6 13l5 5"></path></svg>Arsenal</a>
      <a href="Graphite-Desktop-Memo.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 6px; font-size: 15px; text-decoration: none; background: #1E2A44; color: #6EA0FF"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a2 2 0 0 1 2-2h12v15H7a2 2 0 0 0-2 2V5z"></path><path d="M5 20a2 2 0 0 0 2 1h12v-3"></path></svg>Mémo</a>
    </div>
    <div style="flex: 1"></div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="padding: 0 4px; font-size: 11px; letter-spacing: 0.08em; color: #A1A1AA">TON CONTEXTE</span>
      <a href="Graphite-Desktop-Equipement.dc.html" aria-label="Ton équipement : bouclier en argent niveau 3, compétence Blocage 25" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #2E2E33; border-radius: 6px; color: #EDEDEF; text-decoration: none">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#6EA0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"></path></svg>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">Argent N3</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A1A1AA">VD 81 · BLOCAGE 25</span></span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#8A8A93" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a href="Graphite-Desktop-Monde.dc.html" aria-label="Ton monde : combat normal, 1 joueur" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #2E2E33; border-radius: 6px; color: #EDEDEF; text-decoration: none">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#6EA0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"></path></svg>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">Normal</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A1A1AA">1 JOUEUR · ×1</span></span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#8A8A93" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a href="Graphite-Desktop-Reglages.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 6px; font-size: 15px; color: #A1A1AA; text-decoration: none"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Réglages</a>
    </div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; height: 100%; display: flex; flex-direction: column; box-sizing: border-box">
    <header style="padding: 28px 32px 16px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 500">Mémo</h1>
        <p style="margin: 0; font-size: 15px; color: #A1A1AA">Les règles du combat, lues dans Valheim 1.0.20.</p>
      </div>
      <label style="flex: 0 1 340px; display: flex; align-items: center; gap: 8px; height: 40px; border: 1px solid #2E2E33; border-radius: 4px; padding: 0 12px">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8A8A93" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher dans le mémo</span>
        <input type="search" placeholder="Rechercher une règle" style="flex: 1; min-width: 0; height: 38px; background: transparent; border: 0; font-size: 14px">
      </label>
    </header>

    <div style="flex: 1; min-height: 0; display: flex; border-top: 1px solid #2E2E33">
      <nav aria-label="Sommaire du mémo" style="flex: 0 0 260px; box-sizing: border-box; padding: 16px; border-right: 1px solid #2E2E33; display: flex; flex-direction: column; gap: 2px; overflow-y: auto">
        <sc-for list="{{ sections }}" as="s" hint-placeholder-count="8">
          <a href="#{{ s.id }}" style="display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 6px; text-decoration: none; {{ s.tocStyle }}">
            <span style="font-size: 14px">{{ s.title }}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A1A1AA">{{ s.fact }}</span>
          </a>
        </sc-for>
      </nav>

      <div style="flex: 1; min-width: 0; overflow-y: auto; box-sizing: border-box; padding: 24px 32px 32px">
        <div style="max-width: 1040px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 16px; align-items: start">
          <sc-for list="{{ sections }}" as="s" hint-placeholder-count="8">
            <section id="{{ s.id }}" aria-labelledby="{{ s.hid }}" style="background: #1A1A1D; border-radius: 8px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
              <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
                <h2 id="{{ s.hid }}" style="margin: 0; font-size: 16px; font-weight: 500">{{ s.title }}</h2>
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A1A1AA; white-space: nowrap">{{ s.fact }}</span>
              </div>
              <ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.5; color: #EDEDEF">
                <sc-for list="{{ s.items }}" as="i" hint-placeholder-count="4"><li>{{ i }}</li></sc-for>
              </ul>
            </section>
          </sc-for>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const sections = [
      { id: 'parade', title: 'Parade', fact: '0,25 S · 0 END.', items: [
        'Fenêtre de 0,25 s après avoir levé le bouclier. La compétence ne l’élargit pas.',
        'Coûte 0 endurance. Torche et Bâton en rendent 10, Mandevide 15.',
        'L’attaquant titube, même un archer. Sauf les boss (hors Eikthyr) et le Gammeltroll.',
        'Le chrono repart après une attaque ou une roulade, sans lâcher le bouton.',
        'Les écus ne parent pas.'
      ] },
      { id: 'blocage', title: 'Blocage', fact: '≤ 10 END.', items: [
        'La VD, c’est la valeur défensive de l’info-bulle, compétence Blocage comprise.',
        'C’est l’objet en main gauche qui bloque : avec une torche, c’est elle.',
        'Coup ≥ 2 × VD : tu prends coup − VD. En dessous : (coup ÷ VD) ÷ 4 du coup.',
        'Coût : 10 × la part de ta VD utilisée, donc 10 au maximum.',
        'Brisé si ce qui passe fait déborder ta barre, ou si ton endurance tombe à 0.',
        'Un coup par l’arrière n’est jamais bloqué.'
      ] },
      { id: 'barre', title: 'Ta barre de stagger', fact: '40 % PV · 5 S', items: [
        'Elle déborde à 40 % de tes PV max.',
        'Remplie par le physique et la foudre, après armure. Le feu, le poison, la glace et l’esprit ne comptent pas.',
        'En bloquant, ce qui passe le bouclier compte deux fois : avant et après armure.',
        'Elle se vide de 20 % par seconde, sans délai.'
      ] },
      { id: 'monstres', title: 'Faire tituber un monstre', fact: '×2 DÉGÂTS', items: [
        'Seuil : PV max × facteur du monstre (0,3 à 0,5). Les étoiles le multiplient.',
        'Tant qu’il titube, il prend ×2 dégâts de chaque coup.',
        'Atgeir secondaire et coup de pied : stagger ×6. Hache de combat secondaire : ×4.',
        'Les boss, sauf Eikthyr, ne titubent jamais.'
      ] },
      { id: 'imparables', title: 'Imparables', fact: '17 ATTAQUES', items: [
        'Souffles, novas et zones de boss ne se bloquent pas.',
        'La plupart s’esquivent en roulade : souffle de Fader, nova de Yagluth, jet des chamans naingris.',
        'Certaines zones ne s’esquivent pas non plus : fissures de Fader, zone de Masse-d’Os.'
      ] },
      { id: 'combos', title: 'Combos et sournoise', fact: 'DERNIER COUP ×2', items: [
        'Le dernier coup d’un combo de mêlée fait ×2.',
        'Le combo repart à zéro après 0,2 s d’attente.',
        'Sournoise : ×3 avec la plupart des armes, ×6 aux couteaux et armes de poing. Une fois toutes les 5 min par monstre.'
      ] },
      { id: 'roulade', title: 'Roulade', fact: '15 END.', items: [
        'Coûte 15 d’endurance, jusqu’à 50 % de moins avec la compétence Esquive.',
        'Invincible pendant une partie de l’animation.',
        'Esquive parfaite : 50 % de l’endurance rendue et 5 d’adrénaline, une fois par roulade.'
      ] },
      { id: 'effets', title: 'Effets qui changent les règles', fact: '5 EFFETS', items: [
        'Pouvoir de Fader : stagger reçu divisé par deux.',
        'Pouvoir de Masse-d’Os : bloquer ne coûte plus d’endurance.',
        'Hydromel des berserkir : endurance de blocage et de roulade −80 %.',
        'Voile d’ombre : VD en parade ×1,5, endurance de blocage −50 %.',
        'Cape des cendres : endurance de blocage −20 %.'
      ] }
    ];
    return {
      sections: sections.map((s, i) => ({
        id: 'm-' + s.id,
        hid: 'm-' + s.id + '-t',
        title: s.title,
        fact: s.fact,
        items: s.items,
        tocStyle: i === 0 ? 'background: #1E2A44; color: #6EA0FF' : 'color: #EDEDEF'
      }))
    };
  }
}
</script>
</body>
</html>
