<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouveautés · Runes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap">
<style>
body{margin:0}
:root{color-scheme:dark}
a{color:#4FE0C8}a:hover{color:#8CEEDD}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1113; color: #ECE8DF; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 4px; padding: 6px 16px 6px 4px; border-bottom: 1px solid #30363A">
    <a href="Runes-Reglages.dc.html" aria-label="Retour aux réglages" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ABA79D"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <h2 style="margin: 0; flex: 1; font-size: 18px; font-weight: 500">Nouveautés</h2>
  </header>
  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 22px">
    <sc-for list="{{ versions }}" as="v" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 12px">
        <h3 style="margin: 0; display: flex; align-items: baseline; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid #30363A; font-weight: 400"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500">{{ v.version }}</span><span style="font-size: 12px; color: #8E8A80">{{ v.date }}</span></h3>
        <sc-for list="{{ v.items }}" as="i" hint-placeholder-count="2">
          <div style="display: grid; grid-template-columns: 70px minmax(0, 1fr); column-gap: 10px; align-items: baseline"><span style="justify-self: start; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.06em; line-height: 18px; padding: 0 5px; border: 1px solid #30363A; border-radius: 3px; color: #ABA79D">{{ i.kind }}</span><span style="min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500; line-height: 1.35">{{ i.title }}</span><sc-if value="{{ i.hasDetail }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; line-height: 1.4; color: #ABA79D">{{ i.detail }}</span></sc-if><sc-if value="{{ i.hasThanks }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #ABA79D">Merci {{ i.thanks }}<sc-if value="{{ i.isYours }}" hint-placeholder-val="{{ false }}"> · ton signalement {{ i.number }}</sc-if></span></sc-if></span></div>
        </sc-for>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const item = (kind, title, detail, thanks, number) => ({ kind: kind, title: title, hasDetail: Boolean(detail), detail: detail || '', hasThanks: Boolean(thanks), thanks: thanks || '', isYours: Boolean(number), number: number || '' });
    return {
      versions: [
        { version: '1.14.3', date: '2 nov. 2026', items: [
          item('CORRIGÉ', 'Troll › Frappe au sol : 70 dégâts, pas 60', '', 'Ragnar', '#48')
        ] },
        { version: '1.14.2', date: '31 oct. 2026', items: [
          item('AMÉLIORÉ', 'Maintiens + ou − pour aller plus vite', 'PV max, compétence Blocage, niveaux, Valeur libre.'),
          item('CORRIGÉ', 'Cliquer vite ne sélectionne plus le texte voisin')
        ] },
        { version: '1.14.1', date: '31 oct. 2026', items: [
          item('NOUVEAU', 'Ton monde montre la taille et la vitesse des monstres', "Jusqu'à ×1,2 en Très difficile, hors donjons. Leurs attaques ne vont pas plus vite.")
        ] },
        { version: '1.14.0', date: '31 oct. 2026', items: [
          item('NOUVEAU', 'Emporte ton bibelot, ton pouvoir et tes boissons', 'Allume-les sur une fiche ou dans la Simulation : les verdicts suivent.'),
          item('NOUVEAU', "L'Arsenal liste aussi armures, capes et effets", "Une recherche fouille tout ; une ligne t'en équipe."),
          item('AMÉLIORÉ', "Ton équipement se choisit dans les listes de l'Arsenal", 'Un nouveau joueur commence à mains nues.')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
