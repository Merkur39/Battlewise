<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1214" />
    <title>Foelore</title>
    <script>
      // The saved theme, before the first paint (src/app/store.ts); the app checks it once loaded.
      try {
        const { theme } = JSON.parse(localStorage.getItem('foelore'))
        if (typeof theme === 'string') document.documentElement.dataset.theme = theme
      } catch {
        // Nothing saved, or no storage: the default theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
