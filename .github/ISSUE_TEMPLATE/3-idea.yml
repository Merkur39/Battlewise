name: Idea
description: Something Battlewise could do, or something it misses.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        You can write in French: *le français est bienvenu.*
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: when
    attributes:
      label: When would it help you?
      description: What you were doing in the game when you wished for it.
