name: Wrong number or name
description: A number, a name or a verdict in Foelore does not match the game.
labels: [data]
body:
  - type: markdown
    attributes:
      value: |
        Foelore reads its numbers and names from the game's own files. The game names no monster attack, so attack names come from the Valheim wiki or were written by hand: they are the likeliest to be wrong. Thank you for checking.

        **Reporting from the app is better**: under a creature's attacks or under a verdict, « Wrong number or name? Report it » sends what the app shows, its version and your gear and world along with your words, so the report can be handled without going back and forth.

        You can write in French: *le français est bienvenu.*
  - type: input
    id: subject
    attributes:
      label: Creature, item or screen
      placeholder: Troll, its swing
    validations:
      required: true
  - type: textarea
    id: app
    attributes:
      label: What Foelore shows
    validations:
      required: true
  - type: textarea
    id: game
    attributes:
      label: What the game shows
      description: Or what it should be.
    validations:
      required: true
  - type: input
    id: checked
    attributes:
      label: How you checked
      placeholder: In game, on the wiki, elsewhere…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Foelore version
      description: Settings › About shows it.
      placeholder: 1.3.0
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Your world settings, the creature's stars, a screenshot…
